name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Pull-request checks only; deployment lives in deploy.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, type check, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check generated tags
        run: pnpm tags:check

      - name: Lint
        run: pnpm lint:check

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build
